all:
  children:
    app_servers:
      hosts:
        fastapi:
          ansible_host: "{{ public_vm_ip }}"
          ansible_user: ec2-user
    db_servers:
      hosts:
        postgres:
          ansible_host: "{{ private_vm_ip }}"
          ansible_user: ec2-user
          ansible_ssh_private_key_file: ~/.ssh/id_rsa
          ansible_ssh_common_args: '-o ProxyCommand="ssh -W %h:%p -i ~/.ssh/id_rsa ec2-user@{{ public_vm_ip }}"'